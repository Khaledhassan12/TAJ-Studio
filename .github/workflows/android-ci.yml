name: Android CI Build

on:
  push:
    branches:
      - main
      - ai-rebuild
  pull_request:
    branches:
      - main
      - ai-rebuild
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build"
        required: true
        default: "ai-rebuild"
        type: string

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create CI signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore testkey.keystore \
            -storepass testkey \
            -keyalias testkey \
            -keypass testkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TAJ Studio CI, OU=CI, O=TAJ Studio, L=Cairo, ST=Cairo, C=EG"

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TAJ-Studio-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
